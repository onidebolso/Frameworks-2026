services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frameworks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frameworks"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: y
        LISTEN_PORT: 4321
    env_file:
      - ./y/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./y:/app/y:cached
      - backend_node_modules:/app/y/node_modules
    environment:
      - NODE_ENV=development
      - PUBLIC_SUPABASE_URL
      - PUBLIC_SUPABASE_ANON_KEY
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/frameworks
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=frameworks
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: sh -c "cd /app/y && npm install && npm run dev -- --host 0.0.0.0 --port 4321"
    user: "root"

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3041:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_node_modules:
  postgres_data:
